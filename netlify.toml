[build]
  publish = "site"
  command = ""

# Luôn kiểm tra bản mới: điện thoại và trình duyệt trong Zalo không giữ bản cũ
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Soi mã theo ngành: rate.topbroker.fun chuyển về trang /soi-ma/ (bản web thay bản claude.ai, anh Hải yêu cầu 27/10/2026)
[[redirects]]
  from = "https://rate.topbroker.fun/*"
  to = "https://topbroker.fun/soi-ma/"
  status = 302
  force = true
